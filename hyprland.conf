# Orbital — Hyprland (§28, §22, §23)
# Bordas finas, sombras profundas, blur restrained, animações leves

$activeBorderColor = rgb(57,169,255) rgb(91,192,255) rgb(168,187,212) 45deg
$inactiveBorderColor = rgba(255,255,255,0.08)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 8
    gaps_out = 12
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 16
    rounding_power = 2.5
    active_opacity = 0.97
    inactive_opacity = 0.94
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.018
        contrast = 0.88
        brightness = 0.92
        vibrancy = 0.08
        vibrancy_darkness = 0.55
        ignore_opacity = true
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 28
        render_power = 3
        scale = 1.02
        color = rgba(0,0,0,0.40)
    }
}

animations {
    enabled = true
    bezier = orbitalEase, 0.22, 1, 0.36, 1
    bezier = orbitalInOut, 0.65, 0, 0.35, 1
    bezier = orbitalSnap, 0.34, 1.56, 0.64, 1
    bezier = smoothFade, 0.25, 0.46, 0.45, 0.94
    animation = windows, 1, 4, orbitalEase, slide
    animation = windowsOut, 1, 3.5, orbitalEase, slide
    animation = border, 1, 4, smoothFade
    animation = fade, 1, 3, smoothFade
    animation = workspaces, 1, 4.5, orbitalInOut, slide
    animation = layers, 1, 3, orbitalSnap
}
