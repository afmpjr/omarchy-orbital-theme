# Orbital — Hyprlock (lock screen)
$color = rgba(5, 11, 20, 1)
$inner_color = rgba(10, 20, 34, 0.72)
$outer_color = rgba(57, 169, 255, 1)
$font_color = rgba(244, 248, 255, 1)
$placeholder_color = rgba(145, 164, 187, 0.7)
$check_color = rgba(123, 194, 154, 1)
$fail_color = rgba(232, 106, 106, 1)

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
}

input-field {
    monitor =
    size = 360, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    placeholder_text = Password
    fail_color = $fail_color
    check_color = $check_color
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
